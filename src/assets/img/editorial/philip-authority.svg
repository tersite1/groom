<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">생태안보 연구 체계를 연결한 개념도</title>
  <desc id="desc">숲, 물, 기후 관측, 전력망과 정책 판단이 중앙의 생태안보 연구 체계로 연결된다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b24"/>
      <stop offset="0.55" stop-color="#123d42"/>
      <stop offset="1" stop-color="#0a252f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#a8f0c6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#a8f0c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddf8df"/>
      <stop offset="1" stop-color="#78d8b2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8dd8c0" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#background)"/>
  <rect width="1536" height="1024" fill="url(#grid)"/>
  <circle cx="768" cy="510" r="410" fill="url(#halo)"/>

